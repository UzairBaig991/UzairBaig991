name: Update profile stats

on:
  schedule:
    - cron: "17 */3 * * *"     # every 3 hours
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:
    paths:
      - "scripts/generate_stats.py"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate streak, heatmap and weekday graphics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: UzairBaig991
        run: python scripts/generate_stats.py

      - name: Commit updated graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets data README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update profile stats"
            git pull --rebase --autostash origin main
            git push
          fi
