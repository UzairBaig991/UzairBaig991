<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="68" viewBox="0 0 1000 68">
<defs>
<linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0" spreadMethod="reflect">
<stop offset="0" stop-color="#36BCF7"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#db61a2"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="420 0" dur="5s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#36BCF7"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
<filter id="gl" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<g>
<animateTransform attributeName="transform" type="translate" from="-24 0" to="0 0" dur=".9s" fill="freeze"/>
<animate attributeName="opacity" from="0" to="1" dur=".9s" fill="freeze"/>
<rect x="0" y="12" width="7" height="38" rx="3.5" fill="url(#tg)"><animate attributeName="height" values="38;26;38" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="12;18;12" dur="2.4s" repeatCount="indefinite"/></rect>
<text x="24" y="45" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing=".5" fill="url(#tg)">🚀 Featured Projects</text>
</g>
<rect x="0" y="62" width="1000" height="2.5" rx="1.2" fill="url(#ln)" opacity=".7"/>
<circle cy="63" r="5" fill="#8b5cf6" filter="url(#gl)"><animate attributeName="cx" values="0;1000" dur="4.5s" repeatCount="indefinite"/></circle>
<circle cy="63" r="2.5" fill="#fff"><animate attributeName="cx" values="0;1000" dur="4.5s" repeatCount="indefinite"/></circle>
</svg>