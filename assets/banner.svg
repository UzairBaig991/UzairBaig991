<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Uzair Baig - Software Engineer, Full-Stack and Mobile Developer">
  <defs>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36BCF7">
        <animate attributeName="stop-color" values="#36BCF7;#8b5cf6;#36BCF7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#36BCF7;#8b5cf6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36BCF7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#36BCF7"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typeClip">
      <rect x="60" y="40" height="30" width="0">
        <animate attributeName="width" values="0;190;190;190;0" keyTimes="0;0.25;0.8;0.95;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="card"><rect x="780" y="50" width="360" height="240" rx="16"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="22" fill="#08090f"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>

  <!-- Animated glow blobs -->
  <g filter="url(#blur)" opacity="0.55">
    <circle cx="180" cy="90" r="110" fill="#36BCF7">
      <animate attributeName="cx" values="180;420;180" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;250;90" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="260" r="130" fill="#8b5cf6">
      <animate attributeName="cx" values="1000;760;1000" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="260;90;260" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Floating particles -->
  <g fill="#36BCF7" opacity="0.7">
    <circle cx="640" cy="60" r="2.5"><animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="300" r="2"><animate attributeName="cy" values="300;280;300" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="320" r="2.5"><animate attributeName="cy" values="320;300;320" dur="6s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#8b5cf6" opacity="0.8">
    <circle cx="740" cy="130" r="2.5"><animate attributeName="cy" values="130;110;130" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="305" r="2"><animate attributeName="cy" values="305;285;305" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Window dots + typed command -->
  <circle cx="68" cy="30" r="5" fill="#ff5f57"/>
  <circle cx="88" cy="30" r="5" fill="#febc2e"/>
  <circle cx="108" cy="30" r="5" fill="#28c840"/>
  <g clip-path="url(#typeClip)">
    <text x="60" y="64" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#36BCF7">&gt; whoami</text>
  </g>

  <!-- Name -->
  <text x="60" y="150" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="2" fill="url(#nameGrad)" filter="url(#glow)">
    UZAIR BAIG
    <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
  </text>
  <rect x="62" y="166" width="460" height="3" rx="2" fill="url(#lineGrad)"/>

  <!-- Role -->
  <text x="60" y="205" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="25" font-weight="600" fill="#e6edf3">Software Engineer <tspan fill="#36BCF7">•</tspan> Full-Stack &amp; Mobile Developer</text>
  <text x="60" y="233" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="17" fill="#8b949e">BS Software Engineering @ Riphah International University</text>

  <!-- Skill chips -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="15" text-anchor="middle" fill="#e6edf3">
    <rect x="60" y="252" width="72" height="30" rx="15" fill="#36BCF7" fill-opacity="0.12" stroke="#36BCF7" stroke-opacity="0.6"/>
    <text x="96" y="272">C++</text>
    <rect x="142" y="252" width="86" height="30" rx="15" fill="#36BCF7" fill-opacity="0.12" stroke="#36BCF7" stroke-opacity="0.6"/>
    <text x="185" y="272">Python</text>
    <rect x="238" y="252" width="96" height="30" rx="15" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.7"/>
    <text x="286" y="272">React.js</text>
    <rect x="344" y="252" width="96" height="30" rx="15" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.7"/>
    <text x="392" y="272">Node.js</text>
    <rect x="450" y="252" width="84" height="30" rx="15" fill="#36BCF7" fill-opacity="0.12" stroke="#36BCF7" stroke-opacity="0.6"/>
    <text x="492" y="272">Flutter</text>
    <rect x="544" y="252" width="84" height="30" rx="15" fill="#36BCF7" fill-opacity="0.12" stroke="#36BCF7" stroke-opacity="0.6"/>
    <text x="586" y="272">Kotlin</text>
  </g>

  <!-- Open to work -->
  <circle cx="68" cy="310" r="5" fill="#28c840">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="84" y="315" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#28c840">open to full-stack &amp; mobile opportunities</text>

  <!-- Code card -->
  <rect x="780" y="50" width="360" height="240" rx="16" fill="#0d1117" fill-opacity="0.92" stroke="#36BCF7" stroke-opacity="0.45"/>
  <rect x="780" y="50" width="360" height="34" rx="16" fill="#161b22"/>
  <rect x="780" y="68" width="360" height="16" fill="#161b22"/>
  <circle cx="800" cy="67" r="5" fill="#ff5f57"/>
  <circle cx="818" cy="67" r="5" fill="#febc2e"/>
  <circle cx="836" cy="67" r="5" fill="#28c840"/>
  <text x="960" y="72" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8b949e" text-anchor="middle">uzair.js</text>
  <g clip-path="url(#card)" font-family="Consolas, 'Courier New', monospace" font-size="15">
    <text x="800" y="112"><tspan fill="#ff7b72">const</tspan> <tspan fill="#79c0ff">uzair</tspan> <tspan fill="#e6edf3">= {</tspan></text>
    <text x="820" y="138"><tspan fill="#7ee787">role</tspan><tspan fill="#e6edf3">:&#160;</tspan><tspan fill="#a5d6ff">"Software Engineer"</tspan><tspan fill="#e6edf3">,</tspan></text>
    <text x="820" y="162"><tspan fill="#7ee787">based</tspan><tspan fill="#e6edf3">:&#160;</tspan><tspan fill="#a5d6ff">"Rawalpindi, PK"</tspan><tspan fill="#e6edf3">,</tspan></text>
    <text x="820" y="186"><tspan fill="#7ee787">projects</tspan><tspan fill="#e6edf3">:&#160;</tspan><tspan fill="#d2a8ff">50</tspan><tspan fill="#e6edf3">+,</tspan></text>
    <text x="820" y="210"><tspan fill="#7ee787">certified</tspan><tspan fill="#e6edf3">:&#160;</tspan><tspan fill="#a5d6ff">"Cisco C++"</tspan><tspan fill="#e6edf3">,</tspan></text>
    <text x="820" y="234"><tspan fill="#7ee787">goal</tspan><tspan fill="#e6edf3">:&#160;</tspan><tspan fill="#a5d6ff">"UI/UX Designer"</tspan><tspan fill="#e6edf3">,</tspan></text>
    <text x="820" y="258"><tspan fill="#7ee787">openToWork</tspan><tspan fill="#e6edf3">:&#160;</tspan><tspan fill="#ff7b72">true</tspan></text>
    <text x="800" y="282"><tspan fill="#e6edf3">};</tspan><tspan fill="#36BCF7"> █</tspan>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="338" rx="22" fill="none" stroke="#36BCF7" stroke-opacity="0.35" stroke-width="2"/>
</svg>
